name: AyuGram iOS build from fork

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in fakekarash/AyuGram-iOS
        required: true
        default: master
      mode:
        description: sideload packages an IPA, simulator builds and launches in the simulator
        required: true
        default: sideload
        type: choice
        options:
          - sideload
          - simulator
      dummy_credentials:
        description: Use placeholder api_id/api_hash (compile gate only, artifact cannot log in)
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: ayugram-build-${{ inputs.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the fork at the requested revision
        uses: actions/checkout@v5
        with:
          repository: fakekarash/AyuGram-iOS
          ref: ${{ inputs.ref }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Check macOS, select Xcode and verify pinned Bazel
        run: python3 build-system/ayugram_ci.py preflight

      - name: Initialize exact submodule revisions
        run: |
          set -euo pipefail
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule update --init --recursive --jobs 4
          git submodule status --recursive | tee "$RUNNER_TEMP/ayugram-submodules.txt"
          if grep -Eq '^[-+U]' "$RUNNER_TEMP/ayugram-submodules.txt"; then
            echo '::error::A submodule is missing, conflicted or at the wrong revision'
            exit 1
          fi
          df -h .

      - name: Cache Bazel external repositories
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ayugram-bazel/cache/repos
          key: bazel-repos-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-repos-
      - name: Apply reviewed sideload compatibility patches
        run: python3 build-system/ayugram_sideload_ci.py patch

      - name: Verify fake provisioning profiles are not expired
        run: python3 build-system/renew_fake_profiles.py --check

      - name: Parse AyuGram Swift sources
        run: |
          set -euo pipefail
          # macOS ships bash 3.2, so no mapfile/readarray here.
          find submodules/TelegramCore/Sources/AyuGram submodules/SettingsUI/Sources -name '*AyuGram*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
          printf 'AyuGram sources parsed successfully\n'

      - name: Build (sideload IPA)
        if: inputs.mode == 'sideload'
        env:
          AYUGRAM_KEEP_GOING: "1"
          TELEGRAM_API_ID: ${{ inputs.dummy_credentials == 'true' && '1' || secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ inputs.dummy_credentials == 'true' && '0123456789abcdef0123456789abcdef' || secrets.TELEGRAM_API_HASH }}
        run: python3 -u build-system/ayugram_sideload_ci.py build

      - name: Validate the sideload IPA
        if: inputs.mode == 'sideload'
        run: python3 build-system/ayugram_sideload_ci.py verify

      - name: Build (simulator)
        if: inputs.mode == 'simulator'
        env:
          AYUGRAM_KEEP_GOING: "1"
          TELEGRAM_API_ID: ${{ inputs.dummy_credentials == 'true' && '1' || secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ inputs.dummy_credentials == 'true' && '0123456789abcdef0123456789abcdef' || secrets.TELEGRAM_API_HASH }}
        run: python3 -u build-system/ayugram_simulator_ci.py build

      - name: Install and launch in the simulator
        if: inputs.mode == 'simulator'
        run: python3 build-system/ayugram_simulator_ci.py launch sideload

      - name: Verify the simulator UI rendered
        if: inputs.mode == 'simulator'
        run: swift build-system/validate_simulator_screenshot.swift build/ayugram-simulator/results/sideload/ayugram-simulator.png

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            build/ayugram-sideload/manifest.json
            build/ayugram-sideload/AyuGram.ipa
            build/ayugram-simulator/results/
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          printf 'ref: `%s`  mode: `%s`  dummy credentials: `%s`\n' "${{ inputs.ref }}" "${{ inputs.mode }}" "${{ inputs.dummy_credentials }}" >> "$GITHUB_STEP_SUMMARY"
