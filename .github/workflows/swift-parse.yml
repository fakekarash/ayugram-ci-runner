name: swift parse check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in fakekarash/AyuGram-iOS
        required: true
        default: master

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          repository: fakekarash/AyuGram-iOS
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Toolchain
        run: swift --version

      - name: Parse every AyuGram source and the patched upstream files
        run: |
          set -euo pipefail
          patched=(
            submodules/TelegramUI/Sources/ApplicationContext.swift
            submodules/TelegramUI/Sources/AppDelegate.swift
            submodules/TelegramUI/Sources/SharedWakeupManager.swift
            submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/StringForMessageTimestampStatus.swift
            submodules/TelegramUI/Sources/TelegramRootController.swift
            submodules/TelegramUI/Sources/Chat/ChatControllerOpenViewOnceMediaMessage.swift
            submodules/TelegramUI/Sources/Chat/ChatControllerOpenMessageContextMenu.swift
          )
          files=$(find submodules -name '*AyuGram*.swift' -not -path '*/build-input/*' | sort)
          printf '%s\n' "$files" | wc -l
          printf '%s\n' "${patched[@]}"
          for path in "${patched[@]}"; do
            test -f "$path" || { echo "::error::missing patched file $path"; exit 1; }
          done
          printf '%s\n' "$files" "${patched[@]}" | xargs swiftc -frontend -parse
          printf 'all sources parsed\n'