name: swift parse check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in fakekarash/AyuGram-iOS
        required: true
        default: master

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          repository: fakekarash/AyuGram-iOS
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Toolchain
        run: swift --version

      - name: Parse every AyuGram Swift source
        run: |
          set -euo pipefail
          files=$(find submodules -name '*AyuGram*.swift' -not -path '*/build-input/*' | sort)
          printf '%s\n' "$files"
          printf '%s\n' "$files" | wc -l
          printf '%s\n' "$files" | xargs swiftc -frontend -parse
          printf 'all AyuGram sources parsed\n'